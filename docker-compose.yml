services:

  db:
    image: postgres:14-alpine
    container_name: ecommerce-db

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - ecommerce-network

    restart: unless-stopped


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ecommerce-backend

    environment:
      ConnectionStrings__localhost: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      ASPNETCORE_ENVIRONMENT: Production

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/swagger/v1/swagger.json > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - ecommerce-network

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: ecommerce-frontend

    ports:
      - "80:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - ecommerce-network

    restart: unless-stopped


volumes:
  postgres_data:


networks:
  ecommerce-network:
    driver: bridge



